name = "gfc-directory"
main = "src/index.js"
compatibility_date = "2026-10-01"

# KV namespace for node records: `npx wrangler kv namespace create NODES`, then paste its id here
[[kv_namespaces]]
binding = "NODES"
id = "e9a87cb4c3ab41cc911b611057a5c575"

[vars]
NETWORK = "mainnet"
# Federation public keys that certify official nodes (comma-separated); same as config.PINNED_FEDERATION_PUBKEYS
FEDERATION_PUBKEYS = "9fd2a9a1d74449495d7c92db3f37dbb00586f483af1c2a859aff3c1fb9971670"
